name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  syntax-linux:
    name: Sintaxis (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Comprobar sintaxis
        run: python -m compileall -q -f .
